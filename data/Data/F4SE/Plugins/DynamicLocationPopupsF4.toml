[Settings]

# Keep the popup on screen instead of clearing it after ~3 seconds.
#   false - (default) the title is cleared ~3 seconds after it appears.
#   true  - the title stays up until the game itself shows another
#           notification in the same slot (quest update, etc).
# Native notifications take priority in either mode.
bStayOnScreen = false

# How long the popup stays on screen, in milliseconds, before it is cleared.
# Default 3000 (3 seconds). Values outside [250, 60000] are clamped.
# Ignored when bStayOnScreen = true.
# This controls only our location title, not the game's quest/XP banner timing.
iDisplayTimeMS = 3000
